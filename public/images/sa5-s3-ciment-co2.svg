<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 400" width="1060" height="400"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A5C44"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B5432F"/></marker></defs><rect x="0" y="0" width="1060" height="400" fill="#FFFFFF"/><text x="530.0" y="26" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="17" font-weight="900" fill="#4A3524" text-anchor="middle" >Del turó a la paret: on surt el CO₂ del ciment</text><rect x="55.0" y="118" width="158" height="96" rx="9" fill="#F6EFE6" stroke="#CDB79C" stroke-width="1.6"/><text x="134.0" y="144" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="15" font-weight="900" fill="#4A3524" text-anchor="middle" >Pedrera</text><text x="134.0" y="166" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="12" font-weight="500" fill="#7A5C44" text-anchor="middle" >s'extreu el calcari</text><text x="134.0" y="181" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="12" font-weight="500" fill="#7A5C44" text-anchor="middle" >(CaCO₃)</text><line x1="218.0" y1="166.0" x2="246.0" y2="166.0" stroke="#7A5C44" stroke-width="2.8" marker-end="url(#ar)"/><rect x="253.0" y="118" width="158" height="96" rx="9" fill="#fbeee4" stroke="#4A3524" stroke-width="2.4"/><text x="332.0" y="144" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="15" font-weight="900" fill="#4A3524" text-anchor="middle" >Forn de clínquer</text><text x="332.0" y="166" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="12" font-weight="500" fill="#7A5C44" text-anchor="middle" >1.450 °C</text><line x1="416.0" y1="166.0" x2="444.0" y2="166.0" stroke="#7A5C44" stroke-width="2.8" marker-end="url(#ar)"/><rect x="451.0" y="118" width="158" height="96" rx="9" fill="#F6EFE6" stroke="#CDB79C" stroke-width="1.6"/><text x="530.0" y="144" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="15" font-weight="900" fill="#4A3524" text-anchor="middle" >Ciment</text><text x="530.0" y="166" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="12" font-weight="500" fill="#7A5C44" text-anchor="middle" >es mol i s'ensaca</text><line x1="614.0" y1="166.0" x2="642.0" y2="166.0" stroke="#7A5C44" stroke-width="2.8" marker-end="url(#ar)"/><rect x="649.0" y="118" width="158" height="96" rx="9" fill="#F6EFE6" stroke="#CDB79C" stroke-width="1.6"/><text x="728.0" y="144" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="15" font-weight="900" fill="#4A3524" text-anchor="middle" >Formigó</text><text x="728.0" y="166" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="12" font-weight="500" fill="#7A5C44" text-anchor="middle" >ciment + àrids + aigua</text><line x1="812.0" y1="166.0" x2="840.0" y2="166.0" stroke="#7A5C44" stroke-width="2.8" marker-end="url(#ar)"/><rect x="847.0" y="118" width="158" height="96" rx="9" fill="#F6EFE6" stroke="#CDB79C" stroke-width="1.6"/><text x="926.0" y="144" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="15" font-weight="900" fill="#4A3524" text-anchor="middle" >Enderroc</text><text x="926.0" y="166" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="12" font-weight="500" fill="#7A5C44" text-anchor="middle" >runa: abocador</text><text x="926.0" y="181" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="12" font-weight="500" fill="#7A5C44" text-anchor="middle" >o reciclatge</text><g transform="translate(286.0,78) scale(0.9)"><ellipse cx="0" cy="0" rx="26" ry="15" fill="#8A8175" opacity=".55"/><ellipse cx="-16" cy="6" rx="15" ry="10" fill="#8A8175" opacity=".45"/><ellipse cx="17" cy="5" rx="14" ry="9" fill="#8A8175" opacity=".45"/><text x="0" y="5" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="14" font-weight="900" fill="#fff" text-anchor="middle" >CO₂</text></g><g transform="translate(378.0,78) scale(0.9)"><ellipse cx="0" cy="0" rx="26" ry="15" fill="#8A8175" opacity=".55"/><ellipse cx="-16" cy="6" rx="15" ry="10" fill="#8A8175" opacity=".45"/><ellipse cx="17" cy="5" rx="14" ry="9" fill="#8A8175" opacity=".45"/><text x="0" y="5" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="14" font-weight="900" fill="#fff" text-anchor="middle" >CO₂</text></g><line x1="292.0" y1="94" x2="306.0" y2="116" stroke="#B5432F" stroke-width="2" stroke-dasharray="4 3"/><line x1="372.0" y1="94" x2="358.0" y2="116" stroke="#B5432F" stroke-width="2" stroke-dasharray="4 3"/><text x="164.0" y="56" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#B5432F" text-anchor="middle" >① la roca mateixa es descompon</text><text x="164.0" y="72" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#B5432F" text-anchor="middle" >CaCO₃ → CaO + CO₂</text><text x="508.0" y="56" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#B5432F" text-anchor="middle" >② el combustible que escalfa</text><text x="508.0" y="72" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#B5432F" text-anchor="middle" >el forn fins a 1.450 °C</text><rect x="55.0" y="262" width="356" height="64" rx="9" fill="#FFFFFF" stroke="#CDB79C" stroke-width="1.6"/><text x="71.0" y="288" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="15" font-weight="900" fill="#4A3524" text-anchor="start" >1 tona de ciment</text><text x="71.0" y="310" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="14" font-weight="600" fill="#B5432F" text-anchor="start" >≈ 0,9 tones de CO₂ a l'aire</text><text x="435.0" y="286" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#4A3524" text-anchor="start" >Dels dos punts d'emissió del forn, només un depèn del combustible.</text><text x="435.0" y="306" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#7A5C44" text-anchor="start" >L'altre surt de la pedra i hi seria igualment.</text><text x="530.0" y="386" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#7A5C44" text-anchor="middle" >El gruix de les fletxes no vol dir res: la mida de la cadena és igual per a totes les caixes.</text></svg>
