<rect width="900" height="540" fill="#FFFFFF"/>
<text x="450.0" y="34" font-size="23" fill="#12405C" font-weight="700" text-anchor="middle">La xarxa del nostre pati</text>
<text x="450.0" y="57" font-size="15" fill="#5F7D8A" font-weight="400" text-anchor="middle" font-style="italic">Tres ja hi són i la primera cadena està feta.</text>
