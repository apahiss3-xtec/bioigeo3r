<text x="272" y="128" font-size="13.5" fill="#2E7BA6" font-weight="600" text-anchor="start">(C) consumidor</text>
<rect x="60" y="236" width="200" height="58" rx="8" fill="#E8F3F9" stroke="#2E7BA6" stroke-width="2"/>
<text x="160.0" y="270.0" font-size="18" fill="#1A1A2E" font-weight="600" text-anchor="middle">Cargol</text>
<text x="272" y="272" font-size="13.5" fill="#2E7BA6" font-weight="600" text-anchor="start">(C) consumidor</text>
