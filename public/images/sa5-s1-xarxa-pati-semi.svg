<text x="600" y="418" font-size="26" fill="#9CCBE2" font-weight="700" text-anchor="middle">…</text>
<text x="712" y="416" font-size="13.5" fill="#5F7D8A" font-weight="400" text-anchor="start">( … )</text>
<rect x="60" y="466" width="780" height="54" rx="10" fill="#E8F3F9" stroke="#9CCBE2" stroke-width="1.5"/>
<text x="450.0" y="490" font-size="15.5" fill="#1A1A2E" font-weight="600" text-anchor="middle">Escriu tres éssers vius del vostre cens a les caixes de punts i uneix-los amb fletxes.</text>
<text x="450.0" y="510" font-size="14" fill="#5F7D8A" font-weight="400" text-anchor="middle" font-style="italic">La fletxa va del que és menjat cap al que menja. Posa (P) o (C) a cada parèntesi.</text>
