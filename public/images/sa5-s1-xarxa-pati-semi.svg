<line x1="160.0" y1="380" x2="160.0" y2="298" stroke="#2E7BA6" stroke-width="2.2" marker-end="url(#ar)"/>
<line x1="160.0" y1="236" x2="160.0" y2="154" stroke="#2E7BA6" stroke-width="2.2" marker-end="url(#ar)"/>
<rect x="500" y="92" width="200" height="58" rx="8" fill="#FFFFFF" stroke="#9CCBE2" stroke-width="2" stroke-dasharray="6 4"/>
