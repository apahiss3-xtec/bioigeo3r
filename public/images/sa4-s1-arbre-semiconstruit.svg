<text x="24.0" y="475.5" font-size="9" font-weight="700" fill="#331F5C" letter-spacing="0.09em">ELS CARÀCTERS DE CADA BRANCA</text>
<text x="24.0" y="491.5" font-size="10" fill="#1A1A2E">1. ha de menjar altres éssers vius</text>
<text x="24.0" y="505.5" font-size="10" fill="#1A1A2E">2. té columna vertebral</text>
<text x="24.0" y="519.5" font-size="10" fill="#1A1A2E">3. té quatre extremitats</text>
<text x="350.0" y="491.5" font-size="10" fill="#1A1A2E">4. les cries neixen amb forma d'adult</text>
<text x="350.0" y="505.5" font-size="10" fill="#1A1A2E">5. té pèl i les cries mamen</text>
<text x="350.0" y="519.5" font-size="10" fill="#1A1A2E">6. no té cua</text>
