<circle cx="360" cy="235" r="56" fill="#F6EFE6" stroke="#7A5C44" stroke-width="2"/>
<text x="360" y="231" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="17" font-weight="900" fill="#4A3524" text-anchor="middle" >MAGMA</text>
<text x="360" y="250" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A3524" text-anchor="middle" >roca fosa</text>
<line x1="360" y1="179" x2="360" y2="86" stroke="#7A5C44" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="468" y1="62" x2="596" y2="124" stroke="#7A5C44" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="602" y1="196" x2="602" y2="282" stroke="#7A5C44" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="499" y1="330" x2="230" y2="330" stroke="#7A5C44" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="112" y1="282" x2="305" y2="285" stroke="#7A5C44" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="297" y="128" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="13" font-weight="600" fill="#7A5C44" text-anchor="end" >el magma es refreda</text>
<text x="297" y="145" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="13" font-weight="600" fill="#7A5C44" text-anchor="end" >i cristal·litza</text>
<text x="545" y="100" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="13" font-weight="600" fill="#7A5C44" text-anchor="middle" >l'erosió i el transport</text>
<text x="545" y="117" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="13" font-weight="600" fill="#7A5C44" text-anchor="middle" >la trenquen a trossets</text>
<text x="618" y="232" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="13" font-weight="600" fill="#7A5C44" text-anchor="start" >es compacten</text>
<text x="618" y="249" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="13" font-weight="600" fill="#7A5C44" text-anchor="start" >i s'encolen: litificació</text>
<text x="360" y="374" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="13" font-weight="600" fill="#7A5C44" text-anchor="middle" >la calor i la pressió la transformen</text>
<text x="130" y="244" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="13" font-weight="600" fill="#7A5C44" text-anchor="middle" >es fon del tot</text>
<text x="130" y="261" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="13" font-weight="600" fill="#7A5C44" text-anchor="middle" >i torna a ser magma</text>
<text x="360" y="430" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="13" font-weight="400" fill="#8A7A66" text-anchor="middle" >Escriu dins de cada caixa què hi va. Compte: una de les quatre</text>
<text x="360" y="449" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="13" font-weight="400" fill="#8A7A66" text-anchor="middle" >encara no és una roca.</text>
