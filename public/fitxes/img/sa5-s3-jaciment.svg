 fill="#4A3524" text-anchor="middle" >Els dos blocs contenen la MATEIXA quantitat de mineral: 24 punts cadascun.</text><text x="440.0" y="46" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="13" font-weight="500" fill="#7A5C44" text-anchor="middle" >Només un dels dos val la pena d'explotar-lo.</text><text x="440.0" y="328" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="14" font-weight="700" fill="#4A3524" text-anchor="middle" >Perquè un jaciment s'exploti, li calen les tres coses alhora:</text><rect x="45.0" y="340" width="250" height="86" rx="9" fill="#F6EFE6" stroke="#CDB79C" stroke-width="1.6"/><circle cx="69.0" cy="366" r="13" fill="#7A5C44"/><text x="69.0" y="371" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="14" font-weight="900" fill="#fff" text-anchor="middle" >1</text><text x="91.0" y="371" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="15" font-weight="800" fill="#4A3524" text-anchor="start" >Concentració</text><text x="91.0" y="392" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="12" font-weight="500" fill="#7A5C44" text-anchor="start" >n'hi ha d'haver prou</text><text x="91.0" y="407" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="12" font-weight="500" fill="#7A5C44" text-anchor="start" >junt en un mateix lloc</text><rect x="315.0" y="340" width="250" height="86" rx="9" fill="#F6EFE6" stroke="#CDB79C" stroke-width="1.6"/><circle cx="339.0" cy="366" r="13" fill="#7A5C44"/><text x="339.0" y="371" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="14" font-weight="900" fill="#fff" text-anchor="middle" >2</text><text x="361.0" y="371" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="15" font-weight="800" fill="#4A3524" text-anchor="start" >Accessibilitat</text><text x="361.0" y="392" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="12" font-weight="500" fill="#7A5C44" text-anchor="start" >s'hi ha de poder arribar</text><text x="361.0" y="407" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="12" font-weight="500" fill="#7A5C44" text-anchor="start" >(no a 4.000 m de fondària)</text><rect x="585.0" y="340" width="250" height="86" rx="9" fill="#F6EFE6" stroke="#CDB79C" stroke-width="1.6"/><circle cx="609.0" cy="366" r="13" fill="#7A5C44"/><text x="609.0" y="371" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="14" font-weight="900" fill="#fff" text-anchor="middle" >3</text><text x="631.0" y="371" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="15" font-weight="800" fill="#4A3524" text-anchor="start" >Proximitat</text><text x="631.0" y="392" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="12" font-weight="500" fill="#7A5C44" text-anchor="start" >ha de ser a prop</text><text x="631.0" y="407" font-family="Fira Sans Extra Condensed, Fira Sans Condensed, Arial, sans-serif" font-size="12" font-weight="500" fill="#7A5C44" text-anchor="start" >d'on es fa servir</text></svg>
