<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratori de la sang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@600;700&family=Fira+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8f6;--surface:#ffffff;--ink:#16241c;--muted:#5b6b62;--line:#d5ded8;
      --green:#1f5a3c;--green-2:#2f7a52;--accent:#d98a1e;--ok:#2e7d4f;--warn:#b7791f;--bad:#b23b3b;
      --blood:#c8333a;--vein:#2f6fb0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1712;--surface:#16211a;--ink:#e6efe9;
      --muted:#9fb1a6;--line:#2a3a30;--green:#7cc39a;--green-2:#5fae82;--accent:#f0a945;--ok:#6fcf97;--warn:#e0b252;--bad:#ef7b7b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1712;--surface:#16211a;--ink:#e6efe9;
      --muted:#9fb1a6;--line:#2a3a30;--green:#7cc39a;--green-2:#5fae82;--accent:#f0a945;--ok:#6fcf97;--warn:#e0b252;--bad:#ef7b7b;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fira Sans",system-ui,sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3{font-family:"Fira Sans Extra Condensed",system-ui,sans-serif;font-weight:700;line-height:1.15;margin:0 0 .4em}
h1{font-size:2rem;color:var(--green)}
h2{font-size:1.55rem;color:var(--green)}
h3{font-size:1.2rem}
p{margin:.4em 0 .7em}
a{color:var(--green-2)}
.wrap{max-width:900px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
.back{display:inline-block;margin:12px 0 4px;font-weight:500}
.tag{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
header.top{border-bottom:2px solid var(--green);padding-bottom:10px;margin-bottom:12px}
.sub{color:var(--muted);margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink);padding:9px 14px;min-height:44px;font:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--surface);font-weight:600}
.stepper{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;margin:0 0 6px;scrollbar-width:thin}
.stepper button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:44px;font:inherit;font-size:.9rem;cursor:pointer;white-space:nowrap}
.stepper button[aria-current="step"]{background:var(--green);color:var(--surface);border-color:var(--green);font-weight:600}
.stepper button .n{font-weight:700;margin-right:5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.why{color:var(--muted);margin:0 0 8px}
.why b{color:var(--ink)}
.instr{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:10px;padding:10px 14px;margin:10px 0;font-weight:500}
.bench{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:14px;margin:12px 0}
.anota{border:2px solid var(--accent);background:var(--surface);border-radius:12px;padding:12px 14px;margin:16px 0}
.anota .cl{color:var(--accent);font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;margin:0 0 4px}
.anota ul{margin:4px 0 0;padding-left:20px}
.btn{border:1px solid var(--green);background:var(--green);color:var(--surface);border-radius:10px;padding:10px 16px;min-height:44px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--surface);color:var(--green)}
.btn.sm{padding:6px 12px;min-height:40px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],input[type=time],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px}
input.short{width:110px}
label{display:block;font-weight:500;margin:0 0 4px}
.qb{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.fb{margin-top:6px;font-size:.95rem}
.fb .h{background:var(--bg);border-left:4px solid var(--warn);padding:6px 10px;margin:4px 0;border-radius:6px}
.fb .m{background:var(--bg);border-left:4px solid var(--ok);padding:6px 10px;margin:4px 0;border-radius:6px}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.warnc{color:var(--warn);font-weight:600}
.nav{display:flex;justify-content:space-between;gap:10px;margin:22px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}h1{font-size:1.7rem}}
svg{max-width:100%;height:auto}
.legend{font-size:.9rem;color:var(--muted)}
.credit{font-size:.75rem;color:var(--muted);margin:4px 0 0;line-height:1.35}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-right:4px}
/* targetes */
.deck{display:flex;gap:8px;flex-wrap:wrap}
.tc{width:56px;height:56px;border-radius:8px;border:2px solid var(--line);background:#fbf3e4;padding:2px;cursor:grab;touch-action:manipulation}
.tc.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.tc.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:12px}
.bin{border:2px dashed var(--green-2);border-radius:12px;min-height:110px;padding:8px;background:var(--bg);cursor:pointer}
.bin h4{margin:0 0 6px;font-family:"Fira Sans Extra Condensed",sans-serif;font-size:1.05rem}
.bin .cnt{font-weight:700}
.bin.over{background:var(--surface);border-style:solid}
.bin .deck{gap:4px}
.bin .deck .tc{width:22px;height:22px;border-width:1px;padding:0;cursor:default}
/* imatges reals */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--green);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:44px;font:inherit;cursor:grab}
.chip.sel{background:var(--accent);color:#16241c;border-color:var(--accent);font-weight:600}
.chip.used{opacity:.35;pointer-events:none}
.plate{background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px}
.plate img{display:block;width:100%;height:auto;border-radius:4px}
.himg{position:relative}
.mk{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;border:3px solid #16241c;background:#fff;color:#16241c;font:700 16px "Fira Sans",sans-serif;cursor:pointer;padding:0;line-height:1}
.mk.placed{background:var(--green-2);color:#fff}
.mk.okk{background:var(--ok);color:#fff}
.mk.nok{background:var(--bad);color:#fff}
.mk.hot{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.mk:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#circSvg{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);pointer-events:none}
table.t{width:100%;border-collapse:collapse;font-size:.95rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:middle}
table.t td.nm button{border:1px dashed var(--line);background:var(--bg);color:var(--ink);padding:6px 10px;min-height:40px;border-radius:8px;font:inherit;width:100%;text-align:left;cursor:pointer}
table.t td.nm button.has{border-style:solid;border-color:var(--green-2);font-weight:600}
.ox label{display:inline-flex;gap:4px;align-items:center;margin-right:10px;font-weight:400;min-height:40px}
.rb{display:inline-flex;gap:6px;align-items:center;margin:0 12px 0 0;font-weight:400;min-height:40px}
input[type=radio],input[type=checkbox]{width:22px;height:22px;accent-color:var(--green-2)}
/* circulació */
.seq{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.seq li{counter-increment:s}
.seq button{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 12px;min-height:44px;font:inherit;cursor:pointer}
.seq.built button{border-color:var(--green-2)}
.seq.built li::before{content:counter(s)". ";font-weight:700;color:var(--green)}
.seq.built li{display:flex;gap:6px;align-items:center}
.seq.built li.good button{border-color:var(--ok);background:rgba(46,125,79,.12)}
.seq.built li.badd button{border-color:var(--bad)}
.seq button.taken{opacity:.35}
/* analítica */
.report{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.report .rh{background:var(--green);color:var(--surface);padding:10px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.report .rh b{font-family:"Fira Sans Extra Condensed",sans-serif;font-size:1.15rem}
.an{border-top:1px solid var(--line);padding:10px 14px}
.an .hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.an .val{font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.an.okk{background:rgba(46,125,79,.10)}.an.nok{background:rgba(178,59,59,.10)}
/* pols */
.pimg{position:relative}
.pspot{position:absolute;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;border:3px dashed var(--blood);background:rgba(200,51,58,.14);cursor:pointer;padding:0}
.pspot.on{border-style:solid;background:rgba(200,51,58,.32)}
.pring{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;border:3px solid var(--blood);pointer-events:none;opacity:0}
.pring.beat{animation:beat .35s ease-out}
@keyframes beat{0%{opacity:1;width:24px;height:24px}100%{opacity:0;width:76px;height:76px}}
.big{font-size:2.2rem;font-family:"Fira Sans Extra Condensed",sans-serif;font-weight:700;color:var(--green)}
.timer{font-size:2.6rem;font-family:"Fira Sans Extra Condensed",sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
.copybox{width:100%;min-height:220px;font-family:ui-monospace,Consolas,monospace;font-size:.85rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px}
.sum h3{margin-top:14px;border-bottom:1px solid var(--line);padding-bottom:3px}
.sum dl{margin:0}.sum dt{font-weight:600;margin-top:6px}.sum dd{margin:0 0 4px 0;white-space:pre-wrap}
.sum .empty{color:var(--muted);font-style:italic}
details{margin:8px 0}summary{cursor:pointer;font-weight:600;min-height:32px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.pring.beat{opacity:1;width:40px;height:40px}}
</style>
</head>

var HHINT={
1:["És una vena: porta la sang cap al cor. Ve de la part alta del cos (cap i braços).","Desemboca a la part de dalt de la cavitat de l'esquerra del dibuix (que és la dreta de la persona)."],
2:["És l'artèria més gran: surt del cor i porta sang a tot el cos.","Surt del ventricle de la banda esquerra de la persona i fa un arc cap amunt."],
3:["Surt del cor cap als pulmons. «Artèria» vol dir que SURT del cor.","Surt del ventricle de la banda dreta de la persona i es divideix en dues branques."],

8:["És una cavitat de baix (ventricle) que envia la sang a TOT el cos.","Té la paret més gruixuda i és el ventricle de la banda esquerra de la persona."],
9:["És una vena: porta la sang de la part baixa del cos (cames i tronc) cap al cor.","Entra a l'aurícula dreta per sota."]
};

 canell:{img:"img/pols_canell.webp",w:800,h:522,x:45.3,y:36.2,
  alt:"Il·lustració: una mà posa els dits índex i mig a la cara interna del canell de l'altre braç, a la banda del polze, per notar el pols radial",

 coll:{img:"img/pols_coll.webp",w:768,h:905,x:55.3,y:55.0,
  alt:"Il·lustració: una persona es posa els dits índex i mig al costat del coll, sota la mandíbula, per notar el pols carotidi",
  txt:"Coll: al costat de la nou, sota la mandíbula (artèria caròtida). No premis fort i només d'un costat.",
  credit:'Il·lustració: BruceBlaus (Blausen Medical) · <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.ca" rel="noopener">CC BY-SA 4.0</a> · <a href="https://commons.wikimedia.org/wiki/File:Pulse_(Neck).png" rel="noopener">Wikimedia Commons</a> (retallada, sense el text)'}
};

 var P={1:[26,20],2:[45,20],3:[61,30],4:[82,38.5],5:[23,53],6:[64,44],7:[41,70],8:[67,76],9:[24.5,82]};

function build(){
 var h="";
 /* ---- 1 · Targetes ---- */
 h+='<section class="step" id="st0"><h2>1 · Les targetes de la sang: composició real</h2>'+
 WHY('quina part de la sang és plasma, quina són eritròcits i quina leucòcits i plaquetes. El sobre té 100 targetes; cada targeta és un 1 % del volum de la sang.')+
 '<div class="instr">Treu targetes del sobre i classifica-les per color: grogues (plasma), vermelles (eritròcits) i blanques (leucòcits i plaquetes). Toca una targeta i després la caixa, o arrossega-la.</div>'+
 '<div class="bench" id="cardBench"></div>'+
 '<div id="compBox"></div>'+
 '<div class="instr">Observa el frotis de sang al microscopi i identifica cada tipus de cèl·lula.</div>'+
 '<div class="bench"><div class="grid2"><div><div class="plate"><img src="img/frotis_sang.webp" width="1121" height="699" alt="Frotis de sang al microscopi òptic amb tres tipus de cèl·lules assenyalades amb els números 1, 2 i 3"></div><p class="legend">Frotis de sang real (imatge IE Temple).</p></div><div>'+
 '<label for="fr1">① Cèl·lules bicòncaves, vermelles, sense nucli →</label><select id="fr1" data-save="f"><option value="">Tria…</option><option>eritròcits</option><option>leucòcits</option><option>plaquetes</option></select>'+
 '<label for="fr2" style="margin-top:8px">② Cèl·lules irregulars amb nucli lobulat →</label><select id="fr2" data-save="f"><option value="">Tria…</option><option>eritròcits</option><option>leucòcits</option><option>plaquetes</option></select>'+

 });

function initCards(){
 if(!S.cards||!S.cards.deck||S.cards.deck.length!==100||!S.cards.bins||!S.cards.bins.P){
  var d=[],i;for(i=0;i<55;i++)d.push("P");for(i=0;i<44;i++)d.push("E");d.push("L");
  S.cards={deck:shuffle(d),drawn:0,hand:[],bins:{P:[],E:[],L:[]},sel:null,msg:""};
 }
}
function renderCards(){
 var c=S.cards,el=$("#cardBench");if(!el)return;
 var left=100-c.drawn;
 var h='<div class="row"><button type="button" class="btn sm" id="drawBtn"'+((c.hand.length>0||left===0)?' disabled':'')+'>Treu '+Math.min(25,left)+' targetes del sobre</button><span class="legend">Al sobre queden '+left+' targetes. A la mà: '+c.hand.length+'.</span></div>';
 h+='<div class="deck" id="hand" style="margin-top:8px;min-height:60px" aria-label="Targetes a la mà">';
 c.hand.forEach(function(id){h+='<button type="button" class="tc'+(c.sel===id?' sel':'')+'" draggable="true" data-id="'+id+'" aria-label="Targeta '+(id+1)+'">'+cellSVG(c.deck[id])+'</button>';});
 h+='</div>';
 if(c.hand.length)h+='<div class="qb"><button type="button" class="btn sec sm" id="sortAll">Classifica totes les de la mà (ja saps fer-ho)</button></div>';
 var BN=[["P","Plasma (grogues)"],["E","Eritròcits (vermelles)"],["L","Leucòcits + plaquetes (blanques)"]];
 h+='<div class="bins">'+BN.map(function(b){return '<div class="bin" data-bin="'+b[0]+'" tabindex="0" role="button" aria-label="Caixa: '+b[1]+', '+c.bins[b[0]].length+' targetes"><h4>'+b[1]+': <span class="cnt">'+c.bins[b[0]].length+'</span></h4><div class="deck">'+c.bins[b[0]].map(function(){return '<span class="tc">'+cellSVG(b[0])+'</span>';}).join("")+'</div></div>';}).join("")+'</div>';
 h+='<div class="fb" aria-live="polite">'+(c.msg||"")+'</div>';
 var tot=c.bins.P.length+c.bins.E.length+c.bins.L.length;
 if(tot===100)h+='<div class="fb"><div class="m"><b>Sobre acabat.</b> Recompte: <b>'+c.bins.P.length+'</b> de plasma, <b>'+c.bins.E.length+'</b> d\'eritròcits i <b>'+c.bins.L.length+'</b> de leucòcits + plaquetes, de 100.</div></div>';
 el.innerHTML=h;
 var cb=$("#compBox");
 if(cb)cb.innerHTML=tot===100?'<div class="instr">Contrasta les targetes amb la sang real centrifugada.</div><div class="bench"><div class="grid2"><div class="plate"><img src="img/composicio_sang.webp" width="953" height="927" alt="Composició de la sang en volum: tub centrifugat amb 55 % de plasma i 45 % de cèl·lules, de les quals més del 99 % són glòbuls vermells"></div><div>'+
  '<p><span class="dot" style="background:#f0cf6a;border:1px solid #c8960a"></span><b>55 % plasma:</b> aigua + nutrients + hormones + proteïnes.</p>'+
  '<p><span class="dot" style="background:#c8333a"></span><b>44 % eritròcits:</b> transporten l\'O₂ gràcies a l\'hemoglobina. Sense nucli, viuen uns 120 dies.</p>'+
  '<p><span class="dot" style="background:#9080c0"></span><b>&lt;1 % leucòcits + plaquetes:</b> defensa i coagulació.</p>'+
  '<p class="legend">De les cèl·lules, el 99 % són glòbuls vermells.</p></div></div></div>':'';
}
function moveCard(id,bin){
 var c=S.cards;if(c.hand.indexOf(id)<0)return;
 if(c.deck[id]!==bin){c.msg='<span class="warnc">Aquesta targeta no va aquí. Mira el color: groc = plasma, vermell = eritròcits, blanc = leucòcits i plaquetes.</span>';c.sel=id;renderCards();var b=$('.tc[data-id="'+id+'"]');if(b&&!REDUCED)b.classList.add("shake");save();return;}
 c.hand.splice(c.hand.indexOf(id),1);c.bins[bin].push(id);c.sel=null;c.msg="";
 renderCards();save();
}
function cardEvents(){
 var el=$("#cardBench");
 el.addEventListener("click",function(e){
  var c=S.cards,t=e.target.closest("button,.bin");if(!t)return;
  if(t.id==="drawBtn"){var n=Math.min(25,100-c.drawn);for(var i=0;i<n;i++)c.hand.push(c.drawn+i);c.drawn+=n;c.sel=null;c.msg="";renderCards();save();return;}
  if(t.id==="sortAll"){c.hand.forEach(function(id){c.bins[c.deck[id]].push(id);});c.hand=[];c.sel=null;c.msg="";renderCards();save();return;}
  if(t.classList.contains("tc")&&t.hasAttribute("data-id")){var id=+t.getAttribute("data-id");c.sel=(c.sel===id)?null:id;c.msg="";renderCards();return;}
  if(t.classList.contains("bin")&&c.sel!=null){moveCard(c.sel,t.getAttribute("data-bin"));}
 });
 el.addEventListener("keydown",function(e){var t=e.target;if((e.key==="Enter"||e.key===" ")&&t.classList&&t.classList.contains("bin")){e.preventDefault();if(S.cards.sel!=null)moveCard(S.cards.sel,t.getAttribute("data-bin"));}});

 el.addEventListener("dragover",function(e){var b=e.target.closest(".bin");if(b){e.preventDefault();b.classList.add("over");}});
 el.addEventListener("dragleave",function(e){var b=e.target.closest(".bin");if(b)b.classList.remove("over");});
 el.addEventListener("drop",function(e){var b=e.target.closest(".bin");if(b){e.preventDefault();b.classList.remove("over");var id=parseInt(e.dataTransfer.getData("text/plain"),10);if(!isNaN(id))moveCard(id,b.getAttribute("data-bin"));}});
}

 $$("#heartBox .mk").forEach(function(g){var n=+g.getAttribute("data-n");g.setAttribute("class","mk"+(H.place[n]?" placed":"")+(selChip?" hot":"")+(H.res&&H.res[n]==="ok"?" okk":"")+(H.res&&H.res[n]==="bad"?" nok":""));g.setAttribute("aria-label","Marcador "+n+(H.place[n]?": "+H.place[n]:": buit"));});
}
function heartEvents(){
 var st=$("#st1");
 st.addEventListener("click",function(e){
  var chip=e.target.closest(".chip");
  if(chip){var nm=chip.getAttribute("data-name");selChip=(selChip===nm)?null:nm;renderHeart();return;}
  var mk=e.target.closest(".mk");if(mk){heartTarget(+mk.getAttribute("data-n"));return;}
  var row=e.target.closest("button[data-row]");if(row){heartTarget(+row.getAttribute("data-row"));return;}
  var rv=e.target.closest("[data-reveal]");if(rv){revealHeart(+rv.getAttribute("data-reveal"));}
 });

function heartTarget(n){var H=S.heart;if(selChip){placeName(n,selChip);return;}if(H.place[n]){delete H.place[n];H.res=null;renderHeart();save();}}
function checkHeart(){
 var H=S.heart,fb=$("#fb_heart");H.res={};
 var okc=0,empty=0,html="";
 for(var n=1;n<=9;n++){
  if(!H.place[n]){empty++;continue;}
  if(H.place[n]===NAMES[n]){H.res[n]="ok";okc++;}else{H.res[n]="bad";H.tries[n]=(H.tries[n]||0)+1;}
 }
 var oxbad=[],oxdone=0;for(var m=1;m<=9;m++){var v=S.f["r_ox"+m];if(!v)continue;oxdone++;if((v==="o")!==!!OXY[m])oxbad.push(m);}
 if(empty)html+='<p class="warnc">Et falten '+empty+' marcador(s) per etiquetar.</p>';
 html+='<p><b>'+okc+' de 9</b> etiquetes ben posades.</p>';
 var bads=[];for(var k=1;k<=9;k++)if(H.res[k]==="bad")bads.push(k);
 if(bads.length){html+='<p class="bad">Revisa els marcadors en vermell: '+bads.join(", ")+'.</p>';
  bads.forEach(function(k){var t=H.tries[k]||1;
   html+='<div class="h"><b>Marcador '+k+':</b> '+HHINT[k][Math.min(t,2)-1];
   if(t>=3)html+=' <button type="button" class="btn sec sm" data-reveal="'+k+'">Mostra\'m la resposta</button>';
   html+='</div>';});}
 if(oxdone<9)html+='<p class="warnc">Falta marcar la sang (oxigenada o desoxigenada) a '+(9-oxdone)+' fila(es).</p>';
 if(oxbad.length)html+='<div class="h">Revisa la sang dels números <b>'+oxbad.join(", ")+'</b>. El color de la imatge et dona la pista.</div>';
 else if(oxdone===9)html+='<p class="ok">Tota la sang ben classificada.</p>';
 if(okc===9&&oxdone===9&&!oxbad.length)html+='<p class="ok">Cor etiquetat. Copia la taula a la fitxa.</p>';
 fb.innerHTML=html;renderHeart();save();
}
function revealHeart(k){var H=S.heart;H.place[k]=NAMES[k];renderHeart();checkHeart();}

function renderSeq(k,elId){
 var C=S.circ,list=SEQ[k],seq=C.seq[k],el=$(elId);
 var h='<p class="tag">El teu ordre</p><ol class="seq built" aria-label="El teu ordre">'+seq.map(function(i,pos){var cls=(C.res&&C.res[k])?(C.res[k][pos]?"good":"badd"):"";return '<li class="'+cls+'"><button type="button" data-k="'+k+'" data-un="'+pos+'">'+esc(list[i])+'</button></li>';}).join("")+'</ol>';
 h+='<p class="tag">Passos per ordenar</p><ul class="seq">'+C.ord[k].map(function(i){var taken=seq.indexOf(i)>=0;return '<li><button type="button" data-k="'+k+'" data-add="'+i+'"'+(taken?' class="taken" disabled':'')+'>'+esc(list[i])+'</button></li>';}).join("")+'</ul>';
 h+='<div class="qb"><button type="button" class="btn sec sm" data-chk="'+k+'">Comprova</button><button type="button" class="btn sec sm" data-clr="'+k+'">Torna a començar</button></div><div class="fb" aria-live="polite">'+((C.fb&&C.fb[k])||"")+'</div>';
 el.innerHTML=h;
}
function circDone(){var r=S.circ.res;return !!(r&&r.sys&&r.pul&&r.sys.length&&r.pul.length&&r.sys.every(Boolean)&&r.pul.every(Boolean));}
function renderCirc(){renderSeq("sys","#seqSys");renderSeq("pul","#seqPul");var d=circDone();$("#circShow").hidden=!d;$("#circLock").hidden=d;}
function circEvents(){
 $("#st2").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var C=S.circ;C.res=C.res||{};C.fb=C.fb||{};
  var k=b.getAttribute("data-k")||b.getAttribute("data-clr")||b.getAttribute("data-chk");
  if(b.hasAttribute("data-add")){C.seq[k].push(+b.getAttribute("data-add"));C.res[k]=null;C.fb[k]="";renderCirc();save();}
  else if(b.hasAttribute("data-un")){C.seq[k].splice(+b.getAttribute("data-un"),1);C.res[k]=null;C.fb[k]="";renderCirc();save();}
  else if(b.hasAttribute("data-clr")){C.seq[k]=[];C.res[k]=null;C.fb[k]="";renderCirc();save();}
  else if(b.hasAttribute("data-chk")){checkSeq(k);}
  else if(b.id==="circStep")circStep();
  else if(b.id==="circPlay")circPlay();
 });
}
function checkSeq(k){
 var C=S.circ,seq=C.seq[k];C.res=C.res||{};C.fb=C.fb||{};
 if(seq.length<6){C.fb[k]='<p class="warnc">Encara et falten '+(6-seq.length)+' pas(sos).</p>';renderCirc();return;}
 C.tries[k]=(C.tries[k]||0)+1;
 var res=seq.map(function(v,i){return v===i;});C.res[k]=res;
 var n=res.filter(Boolean).length,h="";
 if(n===6)h='<p class="ok">Recorregut correcte.</p>';
 else{h='<p class="bad">'+n+' de 6 passos ben col·locats.</p>';var t=C.tries[k];
  if(t===1)h+='<div class="h">Mira els passos en vermell. Comença per saber d\'on SURT la sang: '+(k==="sys"?"del cor esquerre.":"del cor dret.")+'</div>';
  else{var first=res.indexOf(false);h+='<div class="h">El pas '+(first+1)+' no és aquest.'+(first===0?' Comença pel cor.':' Pensa què ve just després del pas '+first+'.')+'</div>';
   if(t>=3)h+='<div class="h">Ordre correcte: '+SEQ[k].map(esc).join(" → ")+'</div>';}}
 C.fb[k]=h;renderCirc();save();
}
var segs=[{id:"sg0",col:"#3b7dc4",cap:"Cor dret → artèria pulmonar → pulmons: sang desoxigenada (blava)."},{id:"sg1",col:"#d14b4b",cap:"Pulmons → venes pulmonars → cor esquerre: sang oxigenada (vermella). Als pulmons l'O₂ entra i el CO₂ surt."},{id:"sg2",col:"#d14b4b",cap:"Cor esquerre → aorta → cos: sang oxigenada, a pressió alta."},{id:"sg3",col:"#3b7dc4",cap:"Cos → venes caves → cor dret: sang desoxigenada (l'O₂ s'ha lliurat als músculs i òrgans)."}];
var anim={seg:-1,playing:false,raf:0};
function dotAt(si,t){var p=$("#"+segs[si].id);var L=p.getTotalLength();var pt=p.getPointAtLength(L*t);var d=$("#cdot");d.setAttribute("cx",pt.x);d.setAttribute("cy",pt.y);d.setAttribute("fill",segs[si].col);d.setAttribute("opacity","1");}
function hilite(si){segs.forEach(function(s,i){$("#"+s.id).setAttribute("opacity",i===si?".55":"0");});$("#circCap").innerHTML="<b>Tram "+(si+1)+" de 4:</b> "+segs[si].cap;}
function runOnce(done){var si=anim.seg,start=null;function f(ts){if(start==null)start=ts;var t=Math.min(1,(ts-start)/1600);dotAt(si,t);if(t<1)anim.raf=requestAnimationFrame(f);else done();}anim.raf=requestAnimationFrame(f);}
function stopAnim(){anim.playing=false;cancelAnimationFrame(anim.raf);var b=$("#circPlay");if(b)b.textContent="Reprodueix";}
function circStep(){stopAnim();anim.seg=(anim.seg+1)%4;hilite(anim.seg);if(REDUCED)dotAt(anim.seg,1);else runOnce(function(){});}
function circPlay(){
 if(anim.playing){stopAnim();return;}
 if(REDUCED){circStep();return;}
 anim.playing=true;$("#circPlay").textContent="Atura";
 (function next(){if(!anim.playing)return;anim.seg=(anim.seg+1)%4;hilite(anim.seg);runOnce(function(){if(anim.playing)setTimeout(next,300);});})();
}

/* ============ 4 · Analítica ============ */
var ROWS=[
 {k:"hb",n:"Hemoglobina (Hb)",v:"9,2 g/dL",r:"13,5–17,5 g/dL (home adult)",ans:"b"},
 {k:"eri",n:"Eritròcits",v:"3,8×10⁶/µL",r:"4,5–5,5×10⁶/µL",ans:"b"},
 {k:"vcm",n:"VCM (mida de l'eritròcit)",v:"68 fL",r:"80–100 fL",ans:"b"},
 {k:"fe",n:"Ferro sèric",v:"38 µg/dL",r:"60–180 µg/dL",ans:"b"},
 {k:"leu",n:"Leucòcits",v:"6.200/µL",r:"4.000–11.000/µL",ans:"c"}
];
var LVL={b:"Baix",c:"Correcte",a:"Alt"};
function renderAn(){
 var A=S.an,h="";
 ROWS.forEach(function(r){
  var cur=S.f["r_an_"+r.k]||"",res=A.res&&A.res[r.k];
  h+='<div class="an'+(res==="ok"?" okk":res==="bad"?" nok":"")+'" id="an_'+r.k+'"><div class="hd"><div><b>'+esc(r.n)+'</b><br><span class="legend">Rang de referència: '+esc(r.r)+'</span></div><div class="val">'+esc(r.v)+'</div></div>'+
  '<div role="radiogroup" aria-label="Nivell de '+esc(r.n)+'" style="margin-top:4px">'+
  ["b","c","a"].map(function(x){return '<label class="rb"><input type="radio" name="an_'+r.k+'" value="'+x+'"'+(cur===x?" checked":"")+'> '+LVL[x]+'</label>';}).join("")+'</div></div>';
 });
 $("#anRows").innerHTML=h;
}
function anEvents(){$("#st3").addEventListener("change",function(e){var el=e.target;if(el.type==="radio"&&el.name.indexOf("an_")===0){S.f["r_"+el.name]=el.value;S.an.res=null;save();}});}
function checkAn(){
 var A=S.an;A.res={};var wrong=[],empty=0,html="";
 ROWS.forEach(function(r){var v=S.f["r_an_"+r.k]||"";if(!v){empty++;return;}if(v===r.ans)A.res[r.k]="ok";else{A.res[r.k]="bad";wrong.push(r);}});
 A.tries=(A.tries||0)+1;
 if(empty)html+='<p class="warnc">Et falten '+empty+' fila(es) per marcar.</p>';
 if(wrong.length){html+='<p class="bad">Revisa '+wrong.length+' fila(es) marcades en vermell.</p>';
  wrong.forEach(function(r){html+='<div class="h"><b>'+esc(r.n)+':</b> '+(A.tries<3?"compara "+esc(r.v)+" amb el rang. Està per sota, a dins o per sobre?":esc(r.v)+" amb el rang "+esc(r.r)+(r.ans==="b"?" és més petit que el mínim: «Baix».":" cau dins del rang: «Correcte»."))+'</div>';});}
 else if(!empty)html+='<p class="ok">Taula ben llegida.</p>';
 $("#fb_an").innerHTML=html;renderAn();save();
}

/* ============ Casa · Pols ============ */
var P={site:"canell",placed:false,running:false,timer:0,count:0,target:0,real:0,t0:0,timeouts:[]};
var prevT=0;
function setSite(s){
 if(P.running)return;
 P.site=s;var D=SITES[s];
 $$("[data-site]").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-site")===s));});
 var im=$("#pImg");im.src=D.img;im.width=D.w;im.height=D.h;im.alt=D.alt;
 [$("#spot"),$("#spotRing")].forEach(function(e){e.style.left=D.x+"%";e.style.top=D.y+"%";});
 $("#siteTxt").textContent=D.txt;$("#siteCredit").innerHTML=D.credit;
 P.placed=false;clearTimeout(prevT);$("#spot").classList.remove("on");$("#pStart").disabled=true;
 $("#spotMsg").textContent="Toca el cercle de línia discontínua per posar-hi els dits.";
}
function placeFingers(){
 if(P.running)return;P.placed=true;$("#pStart").disabled=false;$("#spot").classList.add("on");
 P.target=P.target||Math.round(62+Math.random()*22); // pols de repòs amagat, diferent per a cada alumne
 $("#spotMsg").textContent="Dits posats. L'anell vermell marca cada batec. Prem «Comença» quan estiguis a punt.";
 previewBeats();
}
function pulseVisual(){
 var rg=$("#spotRing");rg.classList.remove("beat");void rg.offsetWidth;rg.classList.add("beat");
 if(REDUCED)setTimeout(function(){rg.classList.remove("beat");},250);
 if($("#pSound").checked)thump(0,95,0.09,0.5);
}
function previewBeats(){clearTimeout(prevT);var n=0;(function b(){if(P.running||!P.placed||n>5)return;pulseVisual();n++;prevT=setTimeout(b,60000/P.target);})();}
function startPulse(){
 if(!P.placed||P.running)return;
 clearTimeout(prevT);
 P.running=true;P.count=0;P.real=0;P.t0=performance.now();
 $("#pCount").textContent="0";$("#pTime").textContent="30";$("#pStart").disabled=true;$("#pBeat").disabled=false;$("#pBeat").focus();
 var t=0;P.timeouts=[];
 while(true){t+=60000/P.target*(1+(Math.random()-0.5)*0.08);if(t>30000)break;(function(tt){P.timeouts.push(setTimeout(function(){pulseVisual();P.real++;},tt));})(t);}
 P.timer=setInterval(function(){var el=(performance.now()-P.t0)/1000;$("#pTime").textContent=String(Math.max(0,30-Math.floor(el)));if(el>=30)endPulse();},200);
}
function beatTap(){if(!P.running)return;P.count++;$("#pCount").textContent=String(P.count);}
function endPulse(){
 clearInterval(P.timer);P.timeouts.forEach(clearTimeout);P.running=false;$("#pBeat").disabled=true;$("#pStart").disabled=!P.placed;$("#pTime").textContent="0";
 S.f.pCnt=String(P.count);S.f.pPpm=String(P.count*2);$("#pCnt").value=S.f.pCnt;$("#pPpm").value=S.f.pPpm;
 var d=new Date();S.f.pHora=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);$("#pHora").value=S.f.pHora;
 $("#spotMsg").textContent="Temps! Has comptat "+P.count+" batecs en 30 s. Revisa el càlcul de sota.";save();
}
function checkPulse(){
 var c=parseInt(S.f.pCnt,10),p=parseInt(S.f.pPpm,10),h="";
 if(isNaN(c)||isNaN(p)){$("#fb_pulse").innerHTML='<p class="warnc">Mesura el pols primer (pas 2) o escriu-hi els valors.</p>';return;}
 h+=(p!==c*2)?'<div class="h">Els ppm són els batecs de 30 s multiplicats per 2. '+c+' × 2 = ?</div>':'<p class="ok">Càlcul correcte: '+c+' × 2 = '+p+' ppm.</p>';
 if(p<50||p>110)h+='<div class="h">Aquest valor surt de l\'habitual en repòs (60-100 ppm). Potser t\'has saltat batecs o no estaves en repòs. Repeteix la mesura.</div>';
 if(P.real>0&&Math.abs(P.real-c)>4)h+='<div class="h">L\'anell ha marcat '+P.real+' batecs i n\'has comptat '+c+'. Torna-ho a provar amb més calma.</div>';
 $("#fb_pulse").innerHTML=h;
}

/* so del batec */
var AC=null;
function ctx(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();}catch(e){AC=null;}return AC;}
function thump(t,f,dur,vol){var a=ctx();if(!a)return;try{var o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.setValueAtTime(f,a.currentTime+t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f*0.5),a.currentTime+t+dur);g.gain.setValueAtTime(0.0001,a.currentTime+t);g.gain.exponentialRampToValueAtTime(vol,a.currentTime+t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+t+dur);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+dur+0.05);}catch(e){}}

/* ============ Resum: només dades ============ */
function collect(){
 var out=[];
 function sec(t){var s={t:t,it:[]};out.push(s);return function(l,v){s.it.push({l:l,v:(v==null?"":String(v)).trim()});};}
 var add=sec("1 · Les targetes de la sang"),c=S.cards;
 var tot=c?c.bins.P.length+c.bins.E.length+c.bins.L.length:0;
 add("Recompte de 100 targetes (plasma / eritròcits / leucòcits + plaquetes)",tot?(c.bins.P.length+" / "+c.bins.E.length+" / "+c.bins.L.length+(tot<100?" (en porto "+tot+")":"")):"");
 add("Frotis ①",S.f.fr1);add("Frotis ②",S.f.fr2);add("Frotis ③",S.f.fr3);
 add=sec("2 · Etiqueta el cor");
 for(var n=1;n<=9;n++){var ox=S.f["r_ox"+n]==="o"?"oxigenada":S.f["r_ox"+n]==="d"?"desoxigenada":"";var nm=S.heart.place[n]||"";add(String(n),(nm||ox)?((nm||"(sense nom)")+(ox?" · "+ox:"")):"");}
 add=sec("3 · La doble circulació");
 var sq=function(k){return S.circ.seq[k].map(function(i){return SEQ[k][i];}).join(" → ");};
 add("Circulació gran",sq("sys"));add("Circulació petita",sq("pul"));
 add=sec("4 · L'analítica del Marc (nivell)");
 ROWS.forEach(function(r){var v=S.f["r_an_"+r.k];add(r.n+" ("+r.v+")",v?LVL[v]:"");});
 add=sec("Tasca per a casa · pols en repòs");
 add("Batecs en 30 s",S.f.pCnt);add("Pols en repòs (ppm)",S.f.pPpm);add("Hora",S.f.pHora);
 return out;
}
function renderSummary(){
 var o=collect(),html="",txt="FITXA S3 · El Sistema Circulatori i la Sang · Els meus resultats\n";
 o.forEach(function(s){html+='<h3>'+esc(s.t)+'</h3><dl>';txt+="\n== "+s.t+" ==\n";
  s.it.forEach(function(x){html+='<dt>'+esc(x.l)+'</dt><dd'+(x.v?'':' class="empty"')+'>'+(x.v?esc(x.v):"(encara buit)")+'</dd>';txt+="- "+x.l+": "+(x.v||"(buit)")+"\n";});
  html+='</dl>';});
 $("#sumView").innerHTML=html;$("#copyBox").value=txt;
}
function copySummary(){
 renderSummary();var txt=$("#copyBox").value,msg=$("#copyMsg");
 function fb(){var ta=$("#copyBox");ta.closest("details").open=true;ta.focus();ta.select();try{var ok=document.execCommand("copy");msg.textContent=ok?" Copiat.":" Selecciona el text de sota i copia'l.";}catch(e){msg.textContent=" Selecciona el text de sota i copia'l.";}}
 try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){msg.textContent=" Copiat.";},fb);}else fb();}catch(e){fb();}
}

/* ============ Inicialització ============ */
function main(){
 build();
 initCards();renderCards();cardEvents();
 renderHeart();heartEvents();
 initCirc();renderCirc();circEvents();
 renderAn();anEvents();
 setSite(P.site);
 restoreInputs();
 document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.hasAttribute("data-step")){goStep(+t.getAttribute("data-step"));return;}
  if(t.hasAttribute("data-site")){setSite(t.getAttribute("data-site"));return;}
  switch(t.id){
   case "prevBtn":goStep(S.step-1);break;
   case "nextBtn":goStep(S.step+1);break;
   case "frCheck":checkFr();break;
   case "heartCheck":checkHeart();break;
   case "anCheck":checkAn();break;
   case "spot":placeFingers();break;
   case "pStart":startPulse();break;
   case "pBeat":beatTap();break;
   case "pCheck":checkPulse();break;
   case "copyBtn":copySummary();break;
   case "resetAll":try{localStorage.removeItem(KEY);}catch(e){}location.reload();break;
  }
 });
 document.addEventListener("keydown",function(e){
  if(S.step===4&&P.running&&(e.key==="b"||e.key==="B")&&e.target.tagName!=="INPUT"){beatTap();}
 });
 goStep(S.step||0);
}
main();
</script>
