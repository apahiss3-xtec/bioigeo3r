<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratori de la sang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@600;700&family=Fira+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8f6;--surface:#ffffff;--ink:#16241c;--muted:#5b6b62;--line:#d5ded8;
      --green:#1f5a3c;--green-2:#2f7a52;--accent:#d98a1e;--ok:#2e7d4f;--warn:#b7791f;--bad:#b23b3b;
      --blood:#c8333a;--vein:#2f6fb0;--plasma:#f0cf6a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1712;--surface:#16211a;--ink:#e6efe9;
      --muted:#9fb1a6;--line:#2a3a30;--green:#7cc39a;--green-2:#5fae82;--accent:#f0a945;--ok:#6fcf97;--warn:#e0b252;--bad:#ef7b7b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1712;--surface:#16211a;--ink:#e6efe9;
      --muted:#9fb1a6;--line:#2a3a30;--green:#7cc39a;--green-2:#5fae82;--accent:#f0a945;--ok:#6fcf97;--warn:#e0b252;--bad:#ef7b7b;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fira Sans",system-ui,sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3{font-family:"Fira Sans Extra Condensed",system-ui,sans-serif;font-weight:700;line-height:1.15;margin:0 0 .4em}
h1{font-size:2rem;color:var(--green)}
h2{font-size:1.55rem;color:var(--green)}
h3{font-size:1.2rem}
p{margin:.4em 0 .7em}
a{color:var(--green-2)}
.wrap{max-width:900px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 60px max(16px,env(safe-area-inset-right))}
.back{display:inline-block;margin:12px 0 4px;font-weight:500}
.tag{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
header.top{border-bottom:2px solid var(--green);padding-bottom:10px;margin-bottom:12px}
.sub{color:var(--muted);margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.lvl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink);padding:9px 14px;min-height:44px;font:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--surface);font-weight:600}
.stepper{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;margin:0 0 6px;scrollbar-width:thin}
.stepper button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:44px;font:inherit;font-size:.9rem;cursor:pointer;white-space:nowrap}
.stepper button[aria-current="step"]{background:var(--green);color:var(--surface);border-color:var(--green);font-weight:600}
.stepper button .n{font-weight:700;margin-right:5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.card.info{border-left:5px solid var(--green-2)}
.card.warn{border-left:5px solid var(--warn)}
.card.key{border-left:5px solid var(--accent)}
.cl{font-weight:600;font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 6px}
.instr{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:10px;padding:10px 14px;margin:10px 0;font-weight:500}
.bench{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:14px;margin:12px 0}
.btn{border:1px solid var(--green);background:var(--green);color:var(--surface);border-radius:10px;padding:10px 16px;min-height:44px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--surface);color:var(--green)}
.btn.sm{padding:6px 12px;min-height:40px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
textarea,input[type=text],input[type=number],input[type=time],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px}
textarea{resize:vertical;min-height:84px}
input.short{width:110px}
label{display:block;font-weight:500;margin:0 0 4px}
.q{margin:14px 0}
.qb{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.fb{margin-top:6px;font-size:.95rem}
.fb .h{background:var(--bg);border-left:4px solid var(--warn);padding:6px 10px;margin:4px 0;border-radius:6px}
.fb .m{background:var(--bg);border-left:4px solid var(--ok);padding:6px 10px;margin:4px 0;border-radius:6px}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.warnc{color:var(--warn);font-weight:600}
.nav{display:flex;justify-content:space-between;gap:10px;margin:22px 0}
.lA,.lB,.lC,.lAB,.lBC{}
body:not([data-lvl="A"]) .lA{display:none!important}
body:not([data-lvl="B"]) .lB{display:none!important}
body:not([data-lvl="C"]) .lC{display:none!important}
body[data-lvl="C"] .lAB{display:none!important}
body[data-lvl="A"] .lBC{display:none!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}h1{font-size:1.7rem}}
svg{max-width:100%;height:auto}
.legend{font-size:.9rem;color:var(--muted)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-right:4px}
details{margin:8px 0}summary{cursor:pointer;font-weight:600;min-height:32px}
/* targetes */
.deck{display:flex;gap:8px;flex-wrap:wrap}
.tc{width:56px;height:56px;border-radius:8px;border:2px solid var(--line);background:#fbf3e4;padding:2px;cursor:grab;touch-action:manipulation}
.tc.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.tc.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:12px}
.bin{border:2px dashed var(--green-2);border-radius:12px;min-height:110px;padding:8px;background:var(--bg)}
.bin h4{margin:0 0 6px;font-family:"Fira Sans Extra Condensed",sans-serif;font-size:1.05rem}
.bin .cnt{font-weight:700}
.bin.over{background:var(--surface);border-style:solid}
.bin .deck .tc{width:26px;height:26px;border-width:1px;padding:0;cursor:default}
/* cor */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--green);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:44px;font:inherit;cursor:grab}
.chip.sel{background:var(--accent);color:#16241c;border-color:var(--accent);font-weight:600}
.chip.used{opacity:.35;pointer-events:none}
.plate{background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px}
.plate img{display:block;width:100%;height:auto;border-radius:4px}
.himg{position:relative}
.grid1{display:grid;gap:14px}
.mk{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;border:3px solid #16241c;background:#fff;color:#16241c;font:700 16px "Fira Sans",sans-serif;cursor:pointer;padding:0;line-height:1}
.mk.placed{background:var(--green-2);color:#fff}
.mk.okk{background:var(--ok);color:#fff}
.mk.nok{background:var(--bad);color:#fff}
.mk.hot{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.mk:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#valves{position:absolute;inset:0;pointer-events:none;display:none}
.vv{position:absolute;transform:translate(-50%,-50%);background:var(--accent);color:#16241c;border:2px solid #16241c;border-radius:6px;padding:1px 6px;font:600 12px "Fira Sans",sans-serif;white-space:nowrap}
#circSvg{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);pointer-events:none}
table.t{width:100%;border-collapse:collapse;font-size:.95rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:middle}
table.t td.nm button{border:1px dashed var(--line);background:var(--bg);color:var(--ink);padding:6px 10px;min-height:40px;border-radius:8px;font:inherit;width:100%;text-align:left;cursor:pointer}
table.t td.nm button.has{border-style:solid;border-color:var(--green-2);font-weight:600}
table.t td.nm button.over{background:var(--surface)}
.ox label{display:inline-flex;gap:4px;align-items:center;margin-right:10px;font-weight:400;min-height:40px}
.rb{display:inline-flex;gap:6px;align-items:center;margin:0 12px 0 0;font-weight:400;min-height:40px}
input[type=radio],input[type=checkbox]{width:22px;height:22px;accent-color:var(--green-2)}
/* circulacio */
.seq{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.seq li{counter-increment:s}
.seq button{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 12px;min-height:44px;font:inherit;cursor:pointer}
.seq.built button{border-color:var(--green-2)}
.seq.built li::before{content:counter(s)". ";font-weight:700;color:var(--green)}
.seq.built li{display:flex;gap:6px;align-items:center}
.seq.built li.good button{border-color:var(--ok);background:rgba(46,125,79,.12)}
.seq.built li.badd button{border-color:var(--bad)}
.seq button.taken{opacity:.35}
/* analitica */
.an{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:var(--surface)}
.an .hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.an .val{font-weight:700;font-size:1.15rem}
.an.okk{border-color:var(--ok)}.an.nok{border-color:var(--bad)}
.blank{display:inline-block;width:150px;vertical-align:baseline}
.pulse-spot{cursor:pointer}
.big{font-size:2.2rem;font-family:"Fira Sans Extra Condensed",sans-serif;font-weight:700;color:var(--green)}
.timer{font-size:2.6rem;font-family:"Fira Sans Extra Condensed",sans-serif;font-weight:700}
.copybox{width:100%;min-height:260px;font-family:ui-monospace,Consolas,monospace;font-size:.85rem}
.sum h3{margin-top:14px;border-bottom:1px solid var(--line);padding-bottom:3px}
.sum dl{margin:0}.sum dt{font-weight:600;margin-top:6px}.sum dd{margin:0 0 4px 0;white-space:pre-wrap}
.sum .empty{color:var(--muted);font-style:italic}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<div class="wrap">

<header class="top">

<script>
"use strict";
/* ============ Estat i desat ============ */
var KEY="lab_s3_circulatori_v1";
var S={lvl:"B",step:0,f:{},h:{},m:{},heart:{place:{},tries:{},rev:{},ok:null},cards:null,circ:{ord:null,seq:{sys:[],pul:[]},tries:{sys:0,pul:0}},an:{tries:0},civ:{tries:0},pulse:{},goals:{}};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k in o)S[k]=o[k];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var REG=[]; // registre per al resum
var REDUCED=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function norm(t){return String(t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9₂ ]/g,"").trim();}
function lvc(lv){return lv==="A"?"lA":lv==="B"?"lB":lv==="C"?"lC":lv==="AB"?"lAB":lv==="BC"?"lBC":"";}
function inLv(lv){return lv.indexOf(S.lvl)>=0;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ============ Components de pregunta oberta ============ */
function Q(id,lv,sec,label,o){
  o=o||{};REG.push({sec:sec,lv:lv,label:label,get:function(){return S.f[id]||"";}});
  var hints=o.hints||[];Q.cfg=Q.cfg||{};Q.cfg[id]={hints:hints,model:o.model||""};
  return '<div class="q '+lvc(lv)+'"><label for="'+id+'">'+label+'</label>'+
   '<textarea id="'+id+'" data-save="f" rows="'+(o.rows||3)+'"'+(o.starter?' data-starter="'+esc(o.starter)+'"':'')+'></textarea>'+
   ((hints.length||o.model)?'<div class="qb"><button type="button" class="btn sec sm" data-hint="'+id+'">Una pista</button><button type="button" class="btn sec sm" data-model="'+id+'">Compara amb una resposta model</button></div>':'')+
   '<div class="fb" id="fb_'+id+'" aria-live="polite"></div></div>';
}
function renderFb(id){
  var c=Q.cfg&&Q.cfg[id];if(!c)return;var el=$("#fb_"+id);if(!el)return;
  var n=Math.min(S.h[id]||0,c.hints.length),h="";
  for(var i=0;i<n;i++)h+='<div class="h"><b>Pista '+(i+1)+':</b> '+c.hints[i]+'</div>';
  if(S.m[id])h+='<div class="m"><b>Resposta model:</b> '+c.model+'<br><i>Compara-la amb la teva i corregeix el que calgui amb un altre color.</i></div>';
  el.innerHTML=h;
}
function NOTE(t){return '<div class="card info"><div class="cl">Abans de començar</div>'+t+'</div>';}

/* ============ Dades de la fitxa ============ */
var NAMES={1:"Vena cava superior",2:"Aorta",3:"Artèria pulmonar",4:"Venes pulmonars",5:"Aurícula dreta",6:"Aurícula esquerra",7:"Ventricle dret",8:"Ventricle esquerre",9:"Vena cava inferior"};
var OXY={1:0,2:1,3:0,4:1,5:0,6:1,7:0,8:1,9:0};
var BANK=["Vena cava superior","Vena cava inferior","Artèria pulmonar","Aurícula dreta","Ventricle dret","Aorta","Venes pulmonars","Aurícula esquerra","Ventricle esquerre"];
var HHINT={
1:["És una vena: porta la sang cap al cor. Ve de la part alta del cos (cap i braços).","Desemboca a la part de dalt de la cavitat de l'esquerra del dibuix (que és la dreta de la persona)."],
2:["És l'artèria més gran: surt del cor i porta sang a tot el cos.","Surt del ventricle de la banda esquerra de la persona i fa un arc cap amunt."],
3:["Surt del cor cap als pulmons. «Artèria» vol dir que SURT del cor.","Surt del ventricle de la banda dreta de la persona i es divideix en dues branques."],
4:["Són venes: ARRIBEN al cor. Venen dels pulmons.","Desemboquen a l'aurícula de la banda esquerra de la persona, per la dreta del dibuix."],
5:["És una cavitat de dalt (aurícula) que rep la sang desoxigenada del cos.","Rep les dues venes caves. Mira quina cavitat de dalt té vasos blaus que hi arriben."],
6:["És una cavitat de dalt (aurícula) que rep la sang oxigenada dels pulmons.","Està a la banda esquerra de la persona (dreta del dibuix) i hi arriben les venes pulmonars."],
7:["És una cavitat de baix (ventricle) que envia la sang als pulmons.","Està a sota de l'aurícula dreta i té la paret més fina."],
8:["És una cavitat de baix (ventricle) que envia la sang a TOT el cos.","Té la paret més gruixuda i és el ventricle de la banda esquerra de la persona."],
9:["És una vena: porta la sang de la part baixa del cos (cames i tronc) cap al cor.","Entra a l'aurícula dreta per sota."]
};

/* ============ Construcció de la pàgina ============ */
var STEPS=["Idees prèvies","Targetes de la sang","Etiqueta el cor","Doble circulació","Analítica del Marc","Pols en repòs","Resum"];

function heartHTML(){
 var P={1:[26,20],2:[45,20],3:[61,30],4:[82,38.5],5:[23,53],6:[64,44],7:[41,70],8:[67,76],9:[24.5,82]};
 var h='<div class="plate himg" id="heartBox"><img src="img/cor_seccio_mut.webp" width="570" height="740" alt="Cor humà obert en secció, vista anterior, amb els vasos i les quatre cavitats">';
 for(var n=1;n<=9;n++)h+='<button type="button" class="mk" data-n="'+n+'" aria-label="Marcador '+n+'" style="left:'+P[n][0]+'%;top:'+P[n][1]+'%">'+n+'</button>';
 h+='<div id="valves"><span class="vv" style="left:29%;top:66%">tricúspide</span><span class="vv" style="left:64%;top:60%">mitral</span><span class="vv" style="left:38%;top:50%">semilunar</span></div></div>';
 return h;
}

 var st='fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" opacity="0"';
 return '<img src="img/circulacio_doble.webp" width="1200" height="833" alt="Doble circulació: circuit pulmonar a dalt, cor al centre, resta del cos a baix">'+

 '<path id="sg3" d="M520 745 L350 735 Q268 730 268 650 L268 480 Q268 410 340 410 L470 410 Q520 410 545 440" '+st+'/>'+
 '<circle id="cdot" r="16" fill="#3b7dc4" stroke="#16241c" stroke-width="4" cx="590" cy="420" opacity="0"/></svg>';
}
function build(){
 REG=[];
 var h="";
 /* ---- Pas 0 ---- */
 h+='<section class="step" id="st0"><h2>Idees prèvies</h2><p class="sub">Activa el que ja saps. No hi ha respostes dolentes.</p>'+

 '<div class="card warn"><div class="cl">Cas clínic: Comunicació Interventricular (CIV)</div><p>El <b>septe (envà) interventricular</b> és la paret que separa els dos ventricles. El ventricle esquerre empeny amb molta més força que el dret. Per això, si aquesta paret té un forat (CIV), part de la sang ja oxigenada passa de l\'esquerre al dret i torna als pulmons una segona vegada, sense haver arribat al cos. El cor dret i els pulmons han de moure molta més sang de la que els tocaria.</p>'+

 h+='<section class="step" id="st3" hidden><h2>La doble circulació: per quina raó en calen dues?</h2>'+
 '<p>La sang passa dos cops pel cor a cada volta. El <b>circuit pulmonar</b> (cor ↔ pulmons): la sang agafa O₂. El <b>circuit sistèmic</b> (cor ↔ resta del cos): la sang lliura O₂.</p>'+
 '<div class="instr">Ordena el recorregut de cada circuit: toca els passos en l\'ordre correcte. Toca un pas de la teva llista per treure\'l.</div>'+
 '<div class="grid2"><div class="bench"><h3 style="color:var(--blood)">Circulació gran (sistèmica)</h3><div id="seqSys"></div></div><div class="bench"><h3 style="color:var(--vein)">Circulació petita (pulmonar)</h3><div id="seqPul"></div></div></div>'+

 '<div class="lBC">'+Q("dc_reflex","BC","La doble circulació","Reflexiona: per quina raó calen dues circulacions separades i no una de sola?"+(S.lvl==="B"?" Pista: pensa en la pressió necessària per arribar als peus vs. la que aguanten els delicats alvèols pulmonars.":""),{rows:4,starter:"Crec que calen dues circulacions perquè…",
   hints:["Quina pressió cal per arribar fins als peus? I quina aguanten els alvèols dels pulmons?","Si la sang passés per tot el cos a pressió alta, també passaria pels pulmons…","El cor dret empeny a pressió baixa (pulmons) i l'esquerre a pressió alta (cos)."],
   model:"Per arribar a tot el cos cal molta pressió, però els alvèols dels pulmons són molt fins i delicats i no l'aguantarien. Per això hi ha dues circulacions: el cor dret empeny a pressió baixa cap als pulmons i l'esquerre a pressió alta cap al cos."})+'</div>'+
 '<div class="lA">'+Q("dc_reflexA","A","La doble circulació","Per quina raó calen dues circulacions separades i no una de sola? Justifica-ho amb el gruix de les parets del cor i amb la fragilitat dels alvèols, i digues quin dels dos circuits fallaria primer si el cor només en tingués un.",{rows:5,

 '<div class="card info"><div class="cl">Reflexió científica: William Harvey (1628)</div><p>Harvey va calcular que el cor bombeja tant de volum per hora que és impossible que el fetge el produís contínuament (com creia Galè). Va demostrar la circulació tancada amb càlcul <b>abans</b> que existís el microscopi. <b>Lliçó:</b> la raó pot precedir l\'observació directa.</p></div>'+

 Q("dc_vasos","ABC","La doble circulació","Fixa\'t en la imatge: quin dels tres vasos té la paret més gruixuda, i quina relació té això amb la pressió que hi ha a dins?",{

var AC=null;
function ctx(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();}catch(e){AC=null;}return AC;}
function thump(t,f,dur,vol){var a=ctx();if(!a)return;try{var o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.setValueAtTime(f,a.currentTime+t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f*0.5),a.currentTime+t+dur);g.gain.setValueAtTime(0.0001,a.currentTime+t);g.gain.exponentialRampToValueAtTime(vol,a.currentTime+t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+t+dur);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+dur+0.05);}catch(e){}}
function noise(t,dur,vol){var a=ctx();if(!a)return;try{var b=a.createBuffer(1,Math.floor(a.sampleRate*dur),a.sampleRate),d=b.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);var s=a.createBufferSource();s.buffer=b;var f=a.createBiquadFilter();f.type="bandpass";f.frequency.value=300;var g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime+t);}catch(e){}}
function flash(id,on){var e=$(id);if(e)e.setAttribute("fill",on?"var(--accent)":"var(--line)");}
function playBeat(bufec){
 thump(0,70,0.14,0.9);setTimeout(function(){flash("#tl_lub",1);},0);setTimeout(function(){flash("#tl_lub",0);},180);
 if(bufec){noise(0.2,0.3,0.5);setTimeout(function(){$("#tl_buf").setAttribute("fill","var(--warn)");},200);setTimeout(function(){$("#tl_buf").setAttribute("fill","none");},520);}
 thump(0.55,55,0.12,0.7);setTimeout(function(){flash("#tl_dub",1);},550);setTimeout(function(){flash("#tl_dub",0);},720);
}

var segs=[{id:"sg0",col:"#3b7dc4",cap:"Cor dret → artèria pulmonar → pulmons: porta sang desoxigenada (blava)."},{id:"sg1",col:"#d14b4b",cap:"Pulmons → venes pulmonars → cor esquerre: porta sang oxigenada (vermella). Als pulmons l'O₂ entra i el CO₂ surt."},{id:"sg2",col:"#d14b4b",cap:"Cor esquerre → aorta → cos: porta sang oxigenada a pressió alta."},{id:"sg3",col:"#3b7dc4",cap:"Cos → venes caves → cor dret: porta sang desoxigenada (l'O₂ s'ha lliurat als músculs i òrgans)."}];

 function f(ts){if(start==null)start=ts;var t=Math.min(1,(ts-start)/1600);dotAt(si,t);if(t<1&&anim.running!==false)anim.raf=requestAnimationFrame(f);else done();}

}

}

function startPulse(){
 if(!P.placed||P.running)return;
 clearTimeout(prevT);
 // freqüència de repòs oculta amb variació individual
 P.target=P.target||Math.round(62+Math.random()*22);

 $("#pCount").textContent="0";$("#pTime").textContent="30";$("#pStart").disabled=true;$("#pBeat").disabled=false;$("#pBeat").focus();
 // programar batecs amb petita variabilitat (arítmia sinusal)

 while(true){var iv=60000/P.target*(1+(Math.random()-0.5)*0.08);t+=iv;if(t>30000)break;(function(tt){P.timeouts.push(setTimeout(function(){pulseVisual();P.real++;},tt));})(t);}
 P.timer=setInterval(function(){var el=(performance.now()-P.t0)/1000;P.left=Math.max(0,30-Math.floor(el));$("#pTime").textContent=String(P.left);if(el>=30)endPulse();},200);
}
function beatTap(){if(!P.running)return;P.count++;$("#pCount").textContent=String(P.count);}
function endPulse(){
 clearInterval(P.timer);P.running=false;$("#pBeat").disabled=true;$("#pStart").disabled=false;$("#pTime").textContent="0";
 S.f.pCnt=String(P.count);S.f.pPpm=String(P.count*2);$("#pCnt").value=S.f.pCnt;$("#pPpm").value=S.f.pPpm;
 var d=new Date();S.f.pHora=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);$("#pHora").value=S.f.pHora;
 $("#spotMsg").textContent="Temps! Has comptat "+P.count+" batecs. Revisa els números de sota.";save();
}
function checkPulse(){
 var c=parseInt(S.f.pCnt,10),p=parseInt(S.f.pPpm,10),h="";
 if(isNaN(c)||isNaN(p)){$("#fb_pulse").innerHTML='<p class="warnc">Mesura el pols primer (pas 2) o escriu-hi els valors.</p>';return;}
 if(p!==c*2)h+='<div class="h">Els ppm són els batecs de 30 s multiplicats per 2. '+c+' × 2 = ?</div>';
 else h+='<p class="ok">Càlcul correcte: '+c+' × 2 = '+p+' ppm.</p>';
 if(p<50||p>110)h+='<div class="h">Aquest valor surt de l\'habitual en repòs (60–100 ppm). Pot ser que hagis perdut algun batec o que no estiguessis en repòs. Repeteix la mesura.</div>';
 else h+='<p>Valor dins de l\'habitual en repòs. Comptar a mà té un error d\'uns ±2–4 batecs: per això es repeteix la mesura.</p>';
 if(P.real!=null&&P.real>0&&Math.abs(P.real-c)>4)h+='<div class="h">Has comptat uns quants batecs menys o més dels que hi havia. Torna-ho a provar amb més calma.</div>';
 $("#fb_pulse").innerHTML=h;
}

/* ============ Frotis ============ */
function checkFr(){
 var a=S.f.fr1,b=S.f.fr2,c=S.f.fr3,h="";
 if(!a||!b||!c){$("#fb_fr").innerHTML='<p class="warnc">Contesta les tres.</p>';return;}
 var ok=[a==="eritròcits",b==="leucòcits",c==="plaquetes"];
 h+=ok.map(function(o,i){return o?'<span class="ok">'+"①②③"[i]+" correcte.</span>":'<span class="bad">'+"①②③"[i]+": "+["els eritròcits són els discs vermells, sense nucli.","els leucòcits tenen un nucli lobulat fosc.","les plaquetes són fragments petits."][i]+"</span>";}).join(" ");
 $("#fb_fr").innerHTML="<p>"+h+"</p>";
}

/* ============ Resum ============ */
var SECS=["Idees prèvies","Les targetes de la sang","Etiqueta el cor","La doble circulació","Desxifra l'analítica del Marc","Ampliació","Tasca per a casa: pols en repòs","Objectius i dubtes"];
function collect(){
 var out={};SECS.forEach(function(s){out[s]=[];});
 function add(s,l,v){out[s].push({l:l,v:(v===undefined||v===null||String(v).trim()==="")?"":String(v)});}
 // idees / preguntes obertes per ordre de REG
 var ord={};REG.forEach(function(r){if(!inLv(r.lv))return;if(r.sec==="Etiqueta el cor"||r.sec==="La doble circulació"||r.sec==="Idees prèvies"||r.sec==="Desxifra l'analítica del Marc"||r.sec==="Ampliació"||r.sec==="Les targetes de la sang"){(ord[r.sec]=ord[r.sec]||[]).push(r);}});
 (ord["Idees prèvies"]||[]).forEach(function(r){add("Idees prèvies",r.label,r.get());});
 add("Les targetes de la sang","Hipòtesi: eritròcits de cada 100",S.f.hip_e);add("Les targetes de la sang","Hipòtesi: leucòcits de cada 100",S.f.hip_l);
 add("Les targetes de la sang","Recompte real (de 100 targetes): plasma / eritròcits / leucòcits+plaquetes",S.cards?(S.cards.bins.P.length+" / "+S.cards.bins.E.length+" / "+S.cards.bins.L.length):"");
 add("Les targetes de la sang","① Cèl·lules bicòncaves, vermelles, sense nucli →",S.f.fr1);add("Les targetes de la sang","② Cèl·lules irregulars amb nucli lobulat →",S.f.fr2);add("Les targetes de la sang","③ Fragments petits, irregulars →",S.f.fr3);
 add("Les targetes de la sang","Proporcions reals: 99% glòbuls vermells, i…",S.f.prop1);
 (ord["Les targetes de la sang"]||[]).forEach(function(r){add("Les targetes de la sang",r.label,r.get());});
 // cor
 var lines=[];for(var n=1;n<=9;n++){var nm=S.heart.place[n]||"";var ox=S.lvl==="C"?"":(S.f["r_ox"+n]==="o"?"oxigenada":S.f["r_ox"+n]==="d"?"desoxigenada":"");lines.push(n+" · "+(nm||"(sense posar)")+(ox?" · "+ox:""));}
 add("Etiqueta el cor","Marcadors"+(S.lvl==="C"?" (nom i número)":" (número · nom · sang)"),lines.join("\n"));
 if(S.lvl==="C"){add("Etiqueta el cor","Conclusió escollida: ventricle esquerre",({a:"Com més lluny ha d'arribar la sang, més força cal, i més múscul té la paret",b:"El costat esquerre és més gran perquè sí",c:"El costat esquerre guarda més sang"})[S.f.r_c_vent]||"");add("Etiqueta el cor","So del cor: resposta escollida",({a:"Perquè en tancar-se les làmines xoquen entre elles",b:"Perquè la sang és molt sorollosa",c:"Perquè el cor crida"})[S.f.r_c_bufec]||"");}
 (ord["Etiqueta el cor"]||[]).forEach(function(r){add("Etiqueta el cor",r.label,r.get());});
 var civ=[["Es cansa de seguida quan fa esforç",1],["El costat dret del cor s'engrandeix",2],["Febre alta",3],["Cap símptoma, si el forat és molt petit",4]].filter(function(x){return S.goals["civ"+x[1]];}).map(function(x){return x[0];});
 add("Etiqueta el cor","CIV: símptomes marcats",civ.join("; "));
 // doble circulació
 var sq=function(k){return S.circ.seq[k].map(function(i){return SEQ[k][i];}).join(" → ");};
 add("La doble circulació","Recorregut circulació gran",sq("sys"));add("La doble circulació","Recorregut circulació petita",sq("pul"));
 (ord["La doble circulació"]||[]).forEach(function(r){add("La doble circulació",r.label,r.get());});
 // analitica
 ROWS.forEach(function(r){if(!inLv(r.lv))return;var v=S.f["r_an_"+r.k]||(S.lvl==="C"&&r.k==="hb"?"b":"");var t=v==="b"?"Baix":v==="c"?"Correcte":v==="a"?"Alt":"";add("Desxifra l'analítica del Marc",r.n+" ("+r.v+"; rang "+r.r+")",t+(S.f["an_m_"+r.k]?" · Què vol dir: "+S.f["an_m_"+r.k]:""));});
 if(S.lvl!=="A")add("Desxifra l'analítica del Marc","Diagnòstic: la peça que falla és… / la … baixi / els músculs reben menys…",[S.f.dg1,S.f.dg2,S.f.dg3].join(" / "));
 (ord["Desxifra l'analítica del Marc"]||[]).filter(function(r){return r.label.indexOf("Què vol dir")!==0;}).forEach(function(r){add("Desxifra l'analítica del Marc",r.label,r.get());});
 if(S.lvl==="A"){add("Ampliació","A1 · 1 minut (mL) / 1 hora (L) / vegades el pes",[S.f.hv1,S.f.hv2,S.f.hv3].join(" / "));(ord["Ampliació"]||[]).forEach(function(r){add("Ampliació",r.label,r.get());});}
 add("Tasca per a casa: pols en repòs","El meu pols en repòs (batecs en 30 s · ppm)",(S.f.pCnt||"")+" · "+(S.f.pPpm||"")+" ppm");
 add("Tasca per a casa: pols en repòs","Hora",S.f.pHora);
 OBJ[S.lvl].forEach(function(t,i){add("Objectius i dubtes",(S.goals["goal_"+S.lvl+i]?"[x] ":"[ ] ")+t,"_");});
 add("Objectius i dubtes","Encara em pregunto…",S.f.encara);
 return out;
}
function renderSummary(){
 var o=collect(),html="",txt="FITXA S3 · El Sistema Circulatori i la Sang · Nivell "+S.lvl+"\n";
 SECS.forEach(function(s){var it=o[s];if(!it.length)return;html+='<h3>'+esc(s)+'</h3><dl>';txt+="\n== "+s+" ==\n";
  it.forEach(function(x){var v=x.v==="_"?"":x.v;html+='<dt>'+esc(x.l)+'</dt><dd'+(v||x.v==="_"?'':' class="empty"')+'>'+(v?esc(v):(x.v==="_"?"":"(encara buit)"))+'</dd>';txt+="- "+x.l+(v?": "+v:(x.v==="_"?"":": (buit)"))+"\n";});
  html+='</dl>';});
 $("#sumView").innerHTML=html;$("#copyBox").value=txt;
}
function copySummary(){
 renderSummary();var txt=$("#copyBox").value,msg=$("#copyMsg");
 function fb(){var ta=$("#copyBox");ta.closest("details").open=true;ta.focus();ta.select();try{var ok=document.execCommand("copy");msg.textContent=ok?" Copiat.":" Selecciona el text de sota i copia'l.";}catch(e){msg.textContent=" Selecciona el text de sota i copia'l.";}}
 try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){msg.textContent=" Copiat.";},fb);}else fb();}catch(e){fb();}
}

/* ============ Inicialització ============ */
function init(){
 renderLevelParts();
 initCards();renderCards();
 renderHeart();
 initCirc();renderCirc();
 renderAn();
 Object.keys(Q.cfg||{}).forEach(renderFb);
 setSite(P.site);
 $("#hearType").value="sa";
}
var bound=false;
function bindOnce(){
 if(bound)return;bound=true;
 document.addEventListener("click",function(e){
  var t=e.target.closest("button,summary");if(!t)return;
  if(t.hasAttribute("data-hint")){var id=t.getAttribute("data-hint"),c=Q.cfg[id];S.h[id]=Math.min((S.h[id]||0)+1,c.hints.length||1);renderFb(id);save();return;}
  if(t.hasAttribute("data-model")){var id2=t.getAttribute("data-model");var tx=(S.f[id2]||"").trim();var fb=$("#fb_"+id2);if(tx.length<10){fb.innerHTML='<div class="h">Escriu primer la teva resposta (encara que sigui breu) i després compara-la amb el model.</div>';return;}S.m[id2]=1;renderFb(id2);save();return;}
  if(t.hasAttribute("data-step")){goStep(+t.getAttribute("data-step"));return;}
  if(t.hasAttribute("data-lvl")&&t.closest(".seg")){setLevel(t.getAttribute("data-lvl"));return;}
  if(t.hasAttribute("data-reveal")){revealHeart(+t.getAttribute("data-reveal"));return;}
  if(t.hasAttribute("data-mc")){var nme=t.getAttribute("data-mc"),ans=t.getAttribute("data-ans"),v=S.f["r_"+nme],f2=$("#fb_"+nme);f2.innerHTML=!v?'<div class="h">Tria una opció.</div>':(v===ans?'<p class="ok">Correcte.</p>':'<div class="h">Rellegeix el text de dalt i torna-ho a provar.</div>');return;}
  if(t.hasAttribute("data-site")){setSite(t.getAttribute("data-site"));return;}
  switch(t.id){
   case "prevBtn":goStep(S.step-1);break;
   case "nextBtn":goStep(S.step+1);break;
   case "heartCheck":checkHeart();break;
   case "frCheck":checkFr();break;
   case "civCheck":checkCiv();break;
   case "anCheck":checkAn();break;
   case "dgCheck":checkDg();break;
   case "hvCheck":checkHv();break;
   case "circStep":circStep();break;
   case "circPlay":circPlay();break;
   case "hearBtn":playBeat($("#hearType").value==="bufec");break;
   case "showValves":var vs=$("#valves"),on=vs.style.display==="none";vs.style.display=on?"":"none";t.setAttribute("aria-pressed",String(on));t.textContent=on?"Amaga les vàlvules":"Mostra les vàlvules al cor";break;
   case "pStart":startPulse();break;
   case "pBeat":beatTap();break;
   case "pCheck":checkPulse();break;
   case "copyBtn":copySummary();break;
   case "resetAll":try{localStorage.removeItem(KEY);}catch(e){}location.reload();break;
  }
 });
 document.addEventListener("keydown",function(e){
  if(e.target&&e.target.id==="spot"&&(e.key==="Enter"||e.key===" ")){e.preventDefault();placeFingers();}
  if(S.step===5&&P.running&&(e.key==="b"||e.key==="B")&&e.target.tagName!=="INPUT"&&e.target.tagName!=="TEXTAREA"){beatTap();}
 });
 document.addEventListener("click",function(e){if(e.target.id==="spot")placeFingers();});
 $("#main").addEventListener("change",function(e){if(e.target.id==="hip_e"||e.target.id==="hip_l")save();});
 // clic a «selSame»
 document.addEventListener("click",function(e){var t=e.target.closest("#selSame");if(t&&S.cards&&S.cards.sel!=null){var typ=S.cards.deck[S.cards.sel];S.cards.msg='<span class="legend">Marcada. Ara toca la caixa.</span>';var ids=S.cards.hand.filter(function(i){return S.cards.deck[i]===typ;});S.cards.multi=ids;renderCards();$$("#hand .tc").forEach(function(b){if(S.cards.multi.indexOf(+b.getAttribute("data-id"))>=0)b.classList.add("sel");});}});
 $$(".seg button[data-lvl]").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-lvl")===S.lvl));});
}
function main(){
 document.body.setAttribute("data-lvl",S.lvl);
 build();init();bindOnce();cardEvents();heartEvents();circEvents();anRadioEvents();
 goStep(S.step||0);
}
/* en canviar de nivell es reconstrueix: els listeners delegats a #st* s'han de tornar a lligar */
var _setLevel=setLevel;
setLevel=function(l){S.lvl=l;document.body.setAttribute("data-lvl",l);$$(".seg button[data-lvl]").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-lvl")===l));});save();build();init();cardEvents();heartEvents();circEvents();anRadioEvents();goStep(S.step);};
main();
</script>
